on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Write .env
        shell: bash
        run: |
          echo "USER_CPF=${{ secrets.MAIN_VITE_USER_CPF }}" >> .env
          echo "USER_PASSWORD=${{ secrets.MAIN_VITE_USER_PASSWORD }}" >> .env
          echo "MAIN_VITE_USER_CPF=${{ secrets.MAIN_VITE_USER_CPF }}" >> .env
          echo "MAIN_VITE_USER_PASSWORD=${{ secrets.MAIN_VITE_USER_PASSWORD }}" >> .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux packaging deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Build (typecheck + vite)
        run: pnpm run build

      - name: Package and publish (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm exec electron-builder --win --config --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and publish (macOS)
        if: matrix.os == 'macos-latest'
        run: pnpm exec electron-builder --mac --config --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm exec electron-builder --linux --config --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
